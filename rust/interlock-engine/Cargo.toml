[package]
name = "interlock-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
regex = { version = "=1.12.2", default-features = false, features = ["std", "unicode-case"] }
sha2 = { version = "=0.10.9", default-features = false }
tar = { version = "=0.4.46", default-features = false }
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "raw_value", "float_roundtrip"] }
[dev-dependencies]
serde_json = "1"
