# Example: MCP proxy sidecar / agent pod wiring for the taint bridge.
# The node-local sensor DaemonSet listens on hostPath /var/run/interlock/taint.sock.
# Mount the same directory and set POD_UID via the Downward API.
#
# Peer auth is SO_PEERCRED: when taint_bridge.enabled, sensor config must set
# allowed_uids and/or allowed_gids. For non-root proxies, share a GID:
#   - sensor: socket_gid + allowed_gids (dir 0750, socket 0660 + chown)
#   - proxy pod: securityContext.fsGroup / supplementalGroups with that GID
#
# Sensor ConfigMap snippet:
#   taint_bridge:
#     enabled: true
#     socket_path: /var/run/interlock/taint.sock
#     allowed_gids: [1500]
#     socket_gid: 1500
#
# Proxy ConfigMap snippet (enabled still requires an allowlist for validation;
# dial path does not enforce peercred — sensor does):
#   taint_bridge:
#     enabled: true
#     socket_path: /var/run/interlock/taint.sock
#     allowed_gids: [1500]
#
apiVersion: v1
kind: Pod
metadata:
  name: interlock-proxy-bridge-example
  labels:
    interlock.io/monitor: "true"
spec:
  securityContext:
    fsGroup: 1500
    supplementalGroups: [1500]
  containers:
    - name: mcp-proxy
      image: interlock:dev
      imagePullPolicy: IfNotPresent
      args:
        - --mode=proxy
        - --config=/etc/interlock/interlock.yaml
      env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      volumeMounts:
        - name: taint-bridge
          mountPath: /var/run/interlock
        - name: proxy-config
          mountPath: /etc/interlock
          readOnly: true
  volumes:
    - name: taint-bridge
      hostPath:
        path: /var/run/interlock
        type: DirectoryOrCreate
    - name: proxy-config
      configMap:
        name: interlock-proxy-config # operator-provided; must enable taint_bridge + allowlist
